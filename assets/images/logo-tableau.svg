<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="16" fill="#1F3A5F"/>
  <!-- Tableau cross chart logo -->
  <g transform="translate(60,60)">
    <!-- center dot -->
    <rect x="-5" y="-5" width="10" height="10" fill="#E97627"/>
    <!-- top bar -->
    <rect x="-3" y="-28" width="6" height="20" fill="#ffffff"/>
    <!-- bottom bar -->
    <rect x="-3" y="8" width="6" height="20" fill="#ffffff" opacity="0.6"/>
    <!-- left bar -->
    <rect x="-28" y="-3" width="20" height="6" fill="#ffffff"/>
    <!-- right bar -->
    <rect x="8" y="-3" width="20" height="6" fill="#ffffff" opacity="0.6"/>
    <!-- diagonals -->
    <rect x="-3" y="-20" width="5" height="13" fill="#E97627" opacity="0.7" transform="rotate(45)"/>
    <rect x="-3" y="-20" width="5" height="13" fill="#E97627" opacity="0.7" transform="rotate(-45)"/>
    <rect x="-3" y="-20" width="5" height="13" fill="#E97627" opacity="0.4" transform="rotate(135)"/>
    <rect x="-3" y="-20" width="5" height="13" fill="#E97627" opacity="0.4" transform="rotate(-135)"/>
  </g>
  <text x="60" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E97627">TABLEAU</text>
</svg>
